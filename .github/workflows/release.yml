name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prevent stale versioned bundles from being picked up by the release asset glob.
          rm -f patches/build/libs/patches-*.rvp*
          ./gradlew clean :patches:buildAndroid --no-daemon

          mapfile -t rvp_files < <(find patches/build/libs -maxdepth 1 -type f -name 'patches-*.rvp' -print)
          if [ "${#rvp_files[@]}" -ne 1 ]; then
            printf 'Expected exactly one versioned .rvp, found %s:\n' "${#rvp_files[@]}"
            printf '%s\n' "${rvp_files[@]}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # The Gradle build signs the Maven publication with gpg and fails without a secret key.
      # A throwaway key is enough here; the signature is not meant for verification.
      - name: Create throwaway GPG key
        run: >
          gpg --batch --pinentry-mode loopback --passphrase ''
          --quick-generate-key "ci <ci@users.noreply.github.com>" default default never

      - name: Release
        uses: cycjimmy/semantic-release-action@v5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

      # ReVanced Manager adds a patch source from a URL that returns this small JSON,
      # then downloads the .rvp from "download_url".
      - name: Publish ReVanced Manager bundle info
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          RVP="patches-${TAG#v}.rvp"
          if ! gh release view "$TAG" --json assets --jq --arg rvp "$RVP" '.assets[].name | select(. == $rvp)' | grep -Fxq "$RVP"; then
            echo "::error::Expected release asset $RVP is missing from $TAG"
            exit 1
          fi
          jq -n \
            --arg download_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${RVP}" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg version "$TAG" \
            --arg description "ReVanced Experiments $TAG" \
            '{download_url: $download_url, created_at: $created_at, version: $version, description: $description}' \
            > patches-bundle.json
          cat patches-bundle.json
          gh release upload "$TAG" patches-bundle.json --clobber

      - name: Repair v1.0.4 bundle and delete merged working branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v1.0.4 accidentally included the previous version's .rvp because the
          # build directory retained it and the release asset glob matched both.
          if gh release view v1.0.4 --json assets --jq '.assets[].name | select(. == "patches-1.0.3.rvp")' | grep -Fxq "patches-1.0.3.rvp"; then
            gh release delete-asset v1.0.4 patches-1.0.3.rvp --yes
          fi

          jq -n \
            --arg download_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.4/patches-1.0.4.rvp" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg version "v1.0.4" \
            --arg description "ReVanced Experiments v1.0.4" \
            '{download_url: $download_url, created_at: $created_at, version: $version, description: $description}' \
            > /tmp/patches-bundle-v1.0.4.json
          gh release upload v1.0.4 /tmp/patches-bundle-v1.0.4.json --clobber

          gh api --silent --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/telegram-13.2.1-patch-targets" \
            || echo "::notice::The Telegram 13.2.1 working branch was already removed."

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: "ReVanced Patches template ${{ steps.release.outputs.new_release_git_tag }}"
          subject-path: patches/build/libs/patches-*.rvp

      - name: Delete old branches after stable release
        if: contains(github.event.head_commit.message, 'Telegram push-notification patch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for branch in dev fix/telegram-push-notifications; do
            gh api --silent --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || echo "::warning::Could not delete legacy branch ${branch}"
          done
